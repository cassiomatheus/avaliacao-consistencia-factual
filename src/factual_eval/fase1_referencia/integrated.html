<header>
<div class="topline"><div><h1>Revisão do resumo</h1><p class="subtitle">Confira uma afirmação por vez. Suas decisões ficam salvas.</p></div><label>Seu nome <input id="reviewer" autocomplete="name" placeholder="Nome do pesquisador"></label></div>

<details id="navigation" class="navigation"><summary>Trocar de documento, frase ou afirmação</summary><div class="row"><label>Documento <select id="document"></select></label><label>Frase do resumo <select id="sentence"></select></label><label>Afirmação <select id="claim"></select></label></div></details>
<div id="panel"></div><details id="jobs" class="card" aria-live="polite" hidden></details></main>
<script id="dataset" type="application/json">__DATASET__</script><script>const CONFIG=__CONFIG__;</script><script>
'use strict';
const dataset=JSON.parse(document.getElementById('dataset').textContent), $=id=>document.getElementById(id), esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function translatedReading(text){const t=Object.values(dataset.translations||{}).find(t=>t.source_en===text&&t.translation_pt&&!['failed','pending'].includes(t.status));if(!t)return '';return '<div class="reading-translation"><span class="language-label">Português</span><small>Tradução automática para leitura · confira com o original em inglês</small><p lang="pt-BR">'+esc(t.translation_pt)+'</p>'+(t.warnings?.length?'<details><summary>Conferir possíveis diferenças na tradução</summary><ul>'+t.warnings.map(w=>'<li>'+esc(w)+'</li>').join('')+'</ul></details>':'')+'</div>'}
function bilingual(text){return translatedReading(text)+'<div class="reading-original"><span class="language-label">Inglês · original</span><p lang="en">'+esc(text)+'</p></div>'}
const tabs=['Visão geral','1. Afirmação','2. Evidências','3. Inconsistências','4. Finalizar'];let tab=1,view,review,version,docId=dataset.documents[0]?.doc_id,sentenceId,claimId,dirty=false,saving=false,search='',sourceSearchOpen=false,timer;
const doc=()=>dataset.documents.find(d=>d.doc_id===docId), source=()=>dataset.integrated_sources[docId], sentence=()=>doc()?.summary_sentences.find(s=>s.sentence_id===sentenceId);
const ext=()=>review.integrated, records=()=>Object.values(view.catalog||{}), current=()=>ext().claims[claimId]||view.catalog[claimId];
const ann=()=>review.claims[claimId]??(review.claims[claimId]={claim_valid:'',factual_label:'',review_status:'PENDENTE',full_document_checked:false,search_complete:false,gold_evidence_sets:[],notes:''});
function status(text,error=false){$('status').textContent=text;$('status').className=error?'error':''}
async function api(path,method='GET',body){let r;try{r=await fetch(path,{method,headers:{'X-Audit-Token':CONFIG.token,...(body?{'Content-Type':'application/json'}:{})},...(body?{body:JSON.stringify(body)}:{})})}catch(error){throw Error('Sem conexão com o serviço de revisão. Mantenha o serviço aberto no computador e tente novamente. Não feche esta página se houver alterações ainda não salvas.')}const data=await r.json();if(!r.ok)throw Error(data.error||r.statusText);return data}
function initialize(){review.integrated??={protocol_version:'integrated-human-v1',claims:{},sentences:{},perturbations:{}};for(const k of ['claims','sentences','perturbations'])review.integrated[k]??={};review.claims??={}}
async function reload(){if(saving)throw Error('Aguarde a gravação em andamento.');if(dirty&&!confirm('Há alterações não salvas. Descartar a edição local e carregar o disco?'))return;view=await api('/api/workspace');version=view.version;review=view.review||{schema_version:1,dataset_id:dataset.manifest.dataset_id,reviewer:'',claims:{}};initialize();saves=Promise.resolve();$('reviewer').value=review.reviewer||'';dirty=false;render();status('Revisão aberta. Você pode continuar de onde parou.')}
function ensureClaim(){if(!claimId)return null;const c=current();if(!ext().claims[claimId])ext().claims[claimId]={...c};return ext().claims[claimId]}
function collect(){review.reviewer=$('reviewer').value.trim();const c=claimId?ensureClaim():null;
 if(tab===1&&c&&$('claimText')){c.validated_claim=$('claimText').value;c.claim_review_status=$('claimStatus').value;c.correction_type=$('correctionType').value;ann().notes=$('claimNotes').value}
 if(tab===1&&sentence())ext().sentences[sentenceId]={...(ext().sentences[sentenceId]||{}),selected:$('scope').checked,coverage_reviewed:$('coverage').checked,no_factual_information:$('nonfactual').checked};
 if(tab===2&&c&&$('factual')){Object.assign(ann(),{claim_valid:'SIM',factual_label:$('factual').value,review_status:$('finalized').checked?'FINALIZADO':'PENDENTE',full_document_checked:$('sourceChecked').checked,search_complete:$('searchComplete').checked,notes:$('evidenceNotes').value})}
 if(c){c.updated_at=new Date().toISOString();ann().updated_utc=c.updated_at;ann().reviewed_by=review.reviewer}
}
let saves=Promise.resolve(),saveGeneration=0;
function save(){collect();const snapshot=JSON.parse(JSON.stringify(review)),generation=++saveGeneration;dirty=true;saves=saves.then(async()=>{saving=true;try{const r=await api('/api/review','PUT',{version,review:snapshot});version=r.version;view=await api('/api/workspace');dirty=saveGeneration!==generation;status(dirty?'Salvando suas alterações…':'Suas alterações estão salvas ✓');renderJobs()}finally{saving=false}});return saves}

const names={'':'Escolha uma opção',PENDING:'Ainda não conferi',APPROVED:'Está correta',CORRECTED:'Corrigi o texto',ADDED:'Acrescentei uma informação que faltava',REJECTED:'Não é uma afirmação válida',AMBIGUOUS:'Preciso conferir melhor',INCONCLUSIVE:'Ainda não consigo decidir',SUPPORTED:'O documento confirma a afirmação',CONTRADICTED:'O documento contradiz a afirmação',NOT_SUPPORTED:'Não encontrei evidência suficiente após procurar',NONE:'Nenhuma correção',TEXT_CORRECTION:'Ajuste no texto',OMISSION:'Informação que faltava',DUPLICATE:'Informação repetida',INVALID:'Extração incorreta',numeric_change:'Trocar uma quantidade',same_ner_label:'Trocar um nome ou organização',pronoun_gender_swap:'Mudar a quem um pronome se refere',numeric:'Trocar uma quantidade',negation:'Inserir ou retirar uma negação',antonym:'Trocar um predicado',entity:'Trocar um nome ou organização',coreference:'Mudar a quem um pronome se refere',predicate:'Mudar uma ação ou negação'};
function name(value){return names[value]||value}
function choices(values,current,labels={}){const selected=Array.isArray(current)?current:[current];return values.map(v=>`<option ${selected.includes(v)?'selected':''} value="${esc(v)}">${esc(labels[v]||name(v))}</option>`).join('')}
function docName(did){return 'Documento '+(dataset.documents.findIndex(d=>d.doc_id===did)+1)}
function sentenceName(sid){const d=dataset.documents.find(d=>d.summary_sentences.some(s=>s.sentence_id===sid));return d?'Frase '+(d.summary_sentences.findIndex(s=>s.sentence_id===sid)+1):'Frase a conferir'}
function evidenceText(sid){return doc().sentences.find(s=>s.sentence_id===sid)?.text||'Trecho não encontrado: confira o documento.'}
function selectedEvidence(sid){return (review.draft_sets?.[claimId]||[]).includes(sid)}
function selectionCount(){const n=(review.draft_sets?.[claimId]||[]).length;if($('selectionCount'))$('selectionCount').textContent=n?`${n} ${n===1?'trecho selecionado':'trechos selecionados'}. Salve o grupo quando terminar.`:'Nenhum trecho selecionado.';if($('set'))$('set').disabled=!n}
function storedSets(a,editable=true){return (a.gold_evidence_sets||[]).map((g,i)=>`<div class="card"><strong>Grupo ${i+1} · ${g.length===1?'um trecho basta':g.length+' trechos usados juntos'}</strong>${g.map(sid=>`<p>${esc(evidenceText(sid))}</p>`).join('')}${editable?`<button data-remove-set="${i}">Remover este grupo</button>`:''}</div>`).join('')}
function blockerText(b){const messages={COVERAGE_NOT_REVIEWED:'Confira se esta frase contém alguma informação que faltou na extração.',NO_CLAIMS_OR_NONFACTUAL_CONFIRMATION:'Adicione a informação desta frase ou confirme que ela não contém uma afirmação factual.',NO_VALIDATED_CLAIMS:'Conclua a revisão de pelo menos uma afirmação.',PERTURBATION_NOT_RESOLVED:'Falta aprovar ou recusar uma alteração proposta.',STALE_OR_OUT_OF_SCOPE_APPROVAL:'A afirmação ou suas evidências mudaram. Confira novamente a alteração proposta.',DUPLICATE_CLAIMS_IN_SENTENCE:'Há duas afirmações iguais nesta frase. Confira a duplicação.',NONFACTUAL_SENTENCE_HAS_ACTIVE_CLAIMS:'Esta frase foi marcada como não factual, mas ainda tem afirmações aprovadas.',UNRESOLVED_SUMMARY_ANCHOR:'É preciso conferir de qual frase veio esta afirmação.',REJECTION_REQUIRES_NOTE:'Explique brevemente por que esta afirmação foi recusada.'};return messages[b.reason]||(b.reason.includes('Incomplete claim')?'Falta concluir a afirmação, as evidências ou a conferência do documento.':b.reason.includes('not approved')?'Confirme ou corrija esta afirmação.':b.reason.includes('inconclusive')?'A decisão ainda está em dúvida.':b.reason.includes('evidence')?'Confira os grupos de evidências salvos.':b.reason.includes('Reviewer')?'Preencha seu nome no início da página.':'Confira este item antes de finalizar.')}
function render(){
 if($('sourceSearch'))sourceSearchOpen=$('sourceSearch').open;
 if(!docId)return;
 $('document').innerHTML=dataset.documents.map(d=>`<option value="${esc(d.doc_id)}" ${d.doc_id===docId?'selected':''}>${esc(docName(d.doc_id))}</option>`).join('');
 if(!doc().summary_sentences.some(s=>s.sentence_id===sentenceId))sentenceId=doc().summary_sentences[0]?.sentence_id;
 $('sentence').innerHTML=doc().summary_sentences.map((s,i)=>`<option value="${esc(s.sentence_id)}" ${s.sentence_id===sentenceId?'selected':''}>${i+1}. ${esc(s.text.slice(0,90))}</option>`).join('');
 const cs=records().filter(c=>c.doc_id===docId&&c.sentence_id===sentenceId);
 if(!cs.some(c=>c.reference_claim_id===claimId))claimId=cs[0]?.reference_claim_id;
 $('claim').innerHTML=cs.length?cs.map((c,i)=>`<option value="${esc(c.reference_claim_id)}" ${claimId===c.reference_claim_id?'selected':''}>Afirmação ${i+1}: ${esc(c.validated_claim.slice(0,85))}</option>`).join(''):'<option>Nenhuma afirmação encontrada nesta frase</option>';
 $('tabs').innerHTML=tabs.map((t,i)=>`<button data-tab="${i}" role="tab" aria-selected="${i===tab}">${esc(t)}</button>`).join('');
 const c=claimId?current():null,a=claimId?(review.claims[claimId]||{}):{};
 const instructions=[['Seu resumo, uma afirmação de cada vez','Abra uma frase para conferir o que ela diz, escolha os trechos do documento que permitem verificá-la e depois examine uma alteração proposta.'],['A afirmação representa corretamente o que o resumo diz?','Leia a frase original e confira a afirmação abaixo. Corrija o texto se necessário. A veracidade será verificada no próximo passo.'],['Que trechos do documento permitem verificar a afirmação?','Marque os trechos necessários e salve-os em um grupo. Depois indique se o documento confirma ou contradiz a afirmação, ou se ainda falta evidência.'],['Quais inconsistências podem ser inseridas nesta sentença?','Analise entidade, predicado e correferência. Confira os motivos e compare cada sugestão com o original e as evidências antes de aprovar.'],['Sua revisão está pronta para ser usada na avaliação?','Confira as pendências. Depois de salvar a versão final, o sistema poderá aplicar as alterações aprovadas e executar a avaliação.']];
 $('guide').innerHTML=`<h2>${esc(instructions[tab][0])}</h2><p>${esc(instructions[tab][1])}</p>`;
 $('position').textContent=tab===0?'':`${docName(docId)} · ${sentenceName(sentenceId)} de ${doc().summary_sentences.length}${c?' · Afirmação '+(cs.findIndex(item=>item.reference_claim_id===claimId)+1)+' de '+cs.length:''}`;
 let html='';
 if(tab===0){
  html='<h2>Seu progresso</h2><p>Escolha uma afirmação para continuar a revisão.</p><table><tr><th>Documento</th><th>Frases</th><th>Afirmações</th><th>Verificadas com evidências</th></tr>'+view.progress.documents.map(d=>`<tr><td><button data-doc="${esc(d.doc_id)}">${esc(docName(d.doc_id))}</button></td><td>${d.summary_sentences}</td><td>${d.claims}</td><td>${d.validated} de ${d.claims}</td></tr>`).join('')+'</table><div class="actions"><button class="primary" id="resume">Continuar a revisão</button></div><label><input id="pendingOnly" type="checkbox"> Mostrar somente o que ainda não conferi</label><div id="pendingClaims">'+records().filter(c=>c.doc_id===docId).map(c=>`<div class="pending-item" data-state="${esc(c.claim_review_status)}"><button data-cid="${esc(c.reference_claim_id)}">${esc(c.validated_claim)}</button> <span class="badge">${esc(name(c.claim_review_status))}</span></div>`).join('')+'</div>';
 }
 if(tab===1){
  const coverage=ext().sentences[sentenceId]||{};
  html=`<div class="card original-box"><h3>Frase original do resumo</h3>${bilingual(sentence()?.text)}</div>`;
  if(c)html+=`<div class="card edited-box"><label class="question" for="claimText">Afirmação separada pelo sistema</label><p class="small-copy">Se o texto abaixo mudar o sentido da frase original, corrija-o antes de continuar.</p>${translatedReading(c.validated_claim)}<textarea id="claimText" lang="en" aria-label="Afirmação que será verificada em inglês">${esc(c.validated_claim)}</textarea><details><summary>A afirmação tem algum problema?</summary><label>Como deseja registrar esta afirmação?<select id="claimStatus">${choices(['PENDING','APPROVED','CORRECTED','ADDED','REJECTED','AMBIGUOUS'],c.claim_review_status)}</select></label><label>O que precisou corrigir?<select id="correctionType">${choices(['NONE','TEXT_CORRECTION','OMISSION','DUPLICATE','INVALID','AMBIGUOUS'],c.correction_type||'NONE')}</select></label><label>Explique, se necessário<textarea id="claimNotes">${esc(a.notes||'')}</textarea></label><details><summary>Ver a extração original, preservada</summary><p>${esc(c.raw_extracted_claim??'Esta afirmação foi acrescentada por você.')}</p></details></details></div>`;
  else html+='<p class="empty">O sistema não separou nenhuma afirmação desta frase. Acrescente uma informação que faltou ou confirme, nas opções abaixo, que a frase não contém informação factual.</p>';
  html+=`<label><input type="checkbox" id="coverage" ${coverage.coverage_reviewed?'checked':''}> Conferi se faltou alguma informação factual nesta frase</label><p class="small-copy">Se faltou, acrescente outra afirmação antes de marcar a conferência.</p><button id="addClaim">Acrescentar uma informação que faltou</button><details><summary>Mais opções para esta frase</summary><label><input type="checkbox" id="scope" ${coverage.selected!==false?'checked':''}> Incluir esta frase na revisão</label><label><input type="checkbox" id="nonfactual" ${coverage.no_factual_information?'checked':''}> Esta frase não contém informação factual</label><details><summary>Ler o resumo completo</summary><p>${esc(source().summary)}</p></details></details><div class="actions">${c?'<button id="confirmClaim" class="primary">A afirmação está correta · escolher evidências →</button>':''}<button id="save">Salvar e continuar depois</button><button id="nextItem">Conferir outra afirmação →</button></div>`;
 }
 if(tab===2){
  html=c?`<div class="card"><h3>Afirmação que você está verificando</h3>${bilingual(c.validated_claim)}</div><div class="columns"><section><h3>Trechos sugeridos pelo sistema</h3><p class="small-copy">Marque um ou mais trechos. Se vários forem necessários juntos, salve-os no mesmo grupo.</p>${dataset.candidates.filter(p=>p.claim_id===claimId).sort((a,b)=>a.rank_final-b.rank_final).slice(0,dataset.manifest.top_k).map(p=>`<div class="evidence"><label><input type="checkbox" data-evidence="${esc(p.sentence_id)}" ${selectedEvidence(p.sentence_id)?'checked':''}> ${bilingual(p.sentence_text)}</label><details><summary>Ver posição e pontuação deste trecho</summary><p class="technical">Sugestão ${p.rank_final} · cosseno ${p.score_cosine??'—'} · reordenação ${p.score_cross_encoder_logit??'—'} · ${esc(p.sentence_id)}</p></details></div>`).join('')||'<p>Nenhuma sugestão disponível. Use a busca ao lado para escolher trechos do documento.</p>'}<p id="selectionCount" class="small-copy"></p><button id="set" class="primary">Salvar trechos selecionados como um grupo</button><button id="clearSelection">Limpar seleção</button><div class="sets-list"><h3>Grupos que você já confirmou</h3>${storedSets(a)||'<p class="small-copy">Nenhum grupo salvo ainda.</p>'}</div></section><section><details id="sourceSearch" ${sourceSearchOpen?'open':''}><summary>Procurar outros trechos no documento completo</summary><label>Palavra ou expressão<input id="search" type="search" value="${esc(search)}" placeholder="Por exemplo: FDA, five phases…"></label><div id="passages"></div></details></section></div><section class="card decision-options"><h3>Depois de ler as evidências, o que você conclui?</h3><label>Relação com o documento<select id="factual">${choices(['','SUPPORTED','CONTRADICTED','NOT_SUPPORTED','INCONCLUSIVE'],a.factual_label||'')}</select></label><p class="small-copy">Não encontrar o trecho nas sugestões não significa que ele não exista. Use a busca e confira o documento antes de concluir.</p><label><input id="sourceChecked" type="checkbox" ${a.full_document_checked?'checked':''}> Conferi a fonte além dos trechos sugeridos</label><label><input id="searchComplete" type="checkbox" ${a.search_complete?'checked':''}> Terminei minha busca por evidências para esta afirmação</label><details><summary>Observações e estado da revisão</summary><label>Observações<textarea id="evidenceNotes">${esc(a.notes||'')}</textarea></label><label><input id="finalized" type="checkbox" ${a.review_status==='FINALIZADO'?'checked':''}> Verificação desta afirmação concluída</label></details></section><div class="actions"><button class="primary" id="finishEvidence">Concluir verificação · revisar alterações →</button><button id="save">Salvar e continuar depois</button></div>`:'<p>Volte ao primeiro passo e selecione ou acrescente uma afirmação.</p>';
 }
 if(tab===3){
  const eligible=c&&['APPROVED','CORRECTED','ADDED'].includes(c.claim_review_status)&&a.review_status==='FINALIZADO'&&a.factual_label==='SUPPORTED'&&a.full_document_checked&&a.search_complete&&(a.gold_evidence_sets||[]).length&&review.reviewer;
  const lastAnalysis=(view.jobs||[]).filter(j=>j.action==='generate'&&j.status==='COMPLETE'&&j.result?.applicability&&j.result.claim_id===claimId&&j.result.claim_text===c?.validated_claim&&j.result.sentence_text===sentence()?.text&&eligible&&JSON.stringify(j.result.evidence_selection)===JSON.stringify(a.gold_evidence_sets)).sort((a,b)=>b.created_at.localeCompare(a.created_at))[0]?.result;
  const typeNames={entity:'Entidade',predicate:'Predicado',coreference:'Correferência'},stateNames={SUGGESTED:'Sugestão disponível',NOT_APPLICABLE:'Não se aplica pelos critérios atuais',NO_SAFE_SUGGESTION:'Sem sugestão segura',UNAVAILABLE:'Não foi possível avaliar'};
  html=`<div class="card"><h3>Sentença original do resumo</h3>${sentence()?bilingual(sentence().text):'<p>Selecione uma afirmação no primeiro passo.</p>'}<details><summary>Afirmação validada nesta sentença e suas evidências</summary>${c?bilingual(c.validated_claim):''}${storedSets(a,false)}</details><p>O sistema analisa três tipos de inconsistência. Cada sugestão altera a sentença completa, preservando o restante do texto.</p><ul><li><strong>Entidade:</strong> exige uma entidade nomeada identificada e uma substituição compatível.</li><li><strong>Predicado:</strong> exige uma ação ou relação para a qual exista uma alteração segura nas regras atuais.</li><li><strong>Correferência:</strong> exige uma expressão referencial e confirmação contextual de um antecedente incorreto.</li></ul>${eligible?'<p class="ready">Original validado. Você pode analisar os tipos e receber sugestões.</p>':'<p>Conclua a conferência da afirmação e das evidências antes de gerar sugestões.</p><button data-tab="2">Voltar às evidências</button>'}<div class="actions"><button id="generate" class="primary" ${eligible?'':'disabled'}>Analisar os 3 tipos e sugerir inconsistências</button></div><p class="small-copy">Um tipo pode não se aplicar ou ficar sem sugestão segura. Falta de modelo será indicada como análise indisponível. Nenhuma proposta é aprovada automaticamente.</p></div>`;
  if(lastAnalysis)html+=`<section class="card"><h3>Quais tipos podem ser sugeridos nesta sentença?</h3>${Object.entries(lastAnalysis.applicability).map(([type,item])=>`<div class="evidence"><strong>${esc(typeNames[type])}</strong> · <span class="badge">${esc(stateNames[item.status])}</span><p>${esc(item.reason)}</p>${item.targets?.length?'<p class="small-copy">Elementos identificados: '+item.targets.map(esc).join(', ')+'</p>':''}${item.detail?'<details><summary>Detalhes da análise indisponível</summary><p>'+esc(item.detail)+'</p></details>':''}</div>`).join('')}</section>`;
  const proposals=Object.values(ext().perturbations).filter(p=>p.document_id===docId&&(!c||p.reference_claim_id===claimId));
  html+=proposals.map((p,i)=>`<article class="card"><h3>Proposta ${i+1}: ${esc(name(p.strategy||p.error_category))}</h3>${lastAnalysis&&!Object.values(lastAnalysis.applicability).some(item=>item.proposal_ids.includes(p.injection_id))?'<p class="small-copy">Proposta de uma geração anterior, preservada no histórico da revisão.</p>':''}<span class="badge">${esc(({PENDING:'Ainda não revisada',APPROVED:'Aprovada para o experimento',REJECTED:'Recusada',INCONCLUSIVE:'Em dúvida'})[p.human_review?.status||'PENDING'])}</span><div class="original-box card"><strong>Frase antes da alteração</strong>${bilingual(p.original_sentence_en)}</div><div class="edited-box card"><strong>Frase completa depois da alteração</strong>${bilingual(p.modified_sentence_en)}</div><p>O sistema trocou <strong>${esc(p.edit.original)}</strong> por <strong>${esc(p.edit.replacement)}</strong>.</p><details><summary>Conferir a afirmação alterada e as evidências</summary><p>Afirmação alterada: ${esc(p.modified_claim_en)}</p>${storedSets(a,false)}<p class="small-copy">${esc((p.remaining_caveats||[]).join('; '))}</p></details><label>O que você quer fazer com esta proposta?<select data-proposal-status="${esc(p.injection_id)}">${choices(['PENDING','APPROVED','REJECTED','INCONCLUSIVE'],p.human_review?.status||'PENDING',{PENDING:'Ainda não decidi',APPROVED:'Usar esta alteração no experimento',REJECTED:'Não usar esta alteração',INCONCLUSIVE:'Ainda tenho dúvida sobre esta alteração'})}</select></label><label>Como a frase alterada se relaciona com o documento?<select data-proposal-label="${esc(p.injection_id)}">${choices(['','SUPPORTED','CONTRADICTED','NOT_SUPPORTED','INCONCLUSIVE'],p.human_review?.expected_relation||'')}</select></label><label><input data-proposal-confirm="${esc(p.injection_id)}" type="checkbox" ${p.human_review?.evidence_relation_confirmed?'checked':''}> Conferi a frase inteira e confirmei essa relação usando as evidências</label><details><summary>Acrescentar uma observação</summary><textarea aria-label="Observação sobre a proposta ${i+1}" data-proposal-notes="${esc(p.injection_id)}">${esc(p.human_review?.notes||'')}</textarea></details><button class="primary" data-decide="${esc(p.injection_id)}">Salvar minha decisão sobre esta proposta</button></article>`).join('');
  html+='<div class="bottom-nav row"><button id="nextItem">Revisar a próxima afirmação →</button><button data-tab="4">Ver o que falta para finalizar</button></div>';
 }
 if(tab===4){
  const pending=view.progress.blockers,snapshots=(view.jobs||[]).filter(j=>j.action==='freeze'&&j.status==='COMPLETE');
  const entries=pending.map(b=>{const claim=records().find(c=>c.reference_claim_id===b.id),sid=claim?.sentence_id||(doc().summary_sentences.some(s=>s.sentence_id===b.id)?b.id:null);return `<li class="pending-item">${sid?'<strong>'+esc(sentenceName(sid))+'</strong>: ':''}${esc(blockerText(b))}${claim?` <button data-cid="${esc(claim.reference_claim_id)}">Conferir afirmação</button>`:sid?` <button data-sentence-review="${esc(sid)}">Conferir frase</button>`:''}</li>`});
  html=`<h2>Antes de salvar a versão final</h2>${pending.length?`<p>Ainda há ${pending.length} pendências. Elas não apagam o que você já salvou.</p><ul>${entries.slice(0,8).join('')}</ul>${entries.length>8?'<details><summary>Ver as outras pendências</summary><ul>'+entries.slice(8).join('')+'</ul></details>':''}<button id="resume" class="primary">Continuar a revisão</button>`:'<p class="ready">As informações selecionadas estão prontas para ser salvas como referência.</p>'}<div class="actions"><button id="freeze" class="primary" ${view.progress.can_freeze?'':'disabled'}>Salvar versão final da referência</button></div><p class="small-copy">Essa versão preserva as afirmações, evidências e alterações que você confirmou. Você pode continuar trabalhando depois, sem substituir a versão salva.</p><details ${snapshots.length?'open':''}><summary>Depois da revisão: preparar e avaliar os resumos</summary><label>Versão final que será utilizada<select id="snapshot">${snapshots.map((j,i)=>`<option value="${esc(j.id)}">Versão ${i+1} · ${esc(new Date(j.created_at).toLocaleString('pt-BR'))}</option>`).join('')||'<option>Nenhuma versão final salva ainda</option>'}</select></label><div class="actions"><button id="materialize" ${snapshots.length?'':'disabled'}>Preparar resumos com as alterações aprovadas</button><button id="experiment" ${snapshots.length?'':'disabled'}>Executar avaliação e gerar relatório</button></div><p class="small-copy">A avaliação acontece automaticamente e não recebe suas respostas como pistas. O progresso aparece abaixo.</p></details>`;
 }
 $('panel').innerHTML=html;renderPassages();selectionCount();renderJobs();
}
function renderPassages(){
 if(!$('passages'))return;const matches=doc().sentences.filter(s=>!search||s.text.toLowerCase().includes(search.toLowerCase())||s.sentence_id.includes(search));
 $('passages').innerHTML=matches.slice(0,100).map(s=>`<div class="evidence"><label><input type="checkbox" data-evidence="${esc(s.sentence_id)}" ${selectedEvidence(s.sentence_id)?'checked':''}> ${bilingual(s.text)}</label><details><summary>Ver localização no documento</summary><p class="technical">${esc(s.sentence_id)} · caracteres ${s.char_start}–${s.char_end}</p></details></div>`).join('')+`<p class="small-copy">${matches.length} ${matches.length===1?'trecho encontrado':'trechos encontrados'}. ${matches.length>100?'Mostrando os primeiros 100; use uma expressão mais específica para encontrar outros.':''}</p>`;
}
function renderJobs(){
 const jobs=view.jobs||[],active=jobs.filter(j=>['QUEUED','RUNNING'].includes(j.status));$('jobs').hidden=!jobs.length;
 const actions={generate:'Sugerir alterações',freeze:'Salvar referência final',materialize:'Preparar os resumos',experiment:'Executar a avaliação'},statuses={QUEUED:'Aguardando',RUNNING:'Em andamento',COMPLETE:'Concluído',FAILED:'Não foi concluído',INTERRUPTED:'Interrompido'};
 $('jobs').innerHTML=`<summary>${active.length?'Há '+active.length+' atividade(s) em andamento':'Histórico das atividades'}</summary>`+jobs.map(j=>`<div class="card"><strong>${esc(actions[j.action]||j.action)}</strong> · ${esc(statuses[j.status]||j.status)}${j.error?'<p class="error">Não foi possível concluir esta atividade. Suas decisões anteriores continuam salvas.</p>':''}${j.result?.proposals===0?'<p>Nenhuma alteração segura foi encontrada com essas opções. Você pode escolher outro tipo ou continuar a revisão.</p>':''}<details><summary>Ver detalhes e arquivos desta atividade</summary><pre>${esc(JSON.stringify({etapa:j.stage,erro:j.error,arquivos:j.result},null,2))}</pre></details></div>`).join('');
 if(active.length)$('jobs').open=true;
}
async function advance(){
 const sentences=doc().summary_sentences.filter(s=>ext().sentences[s.sentence_id]?.selected!==false),cs=records().filter(c=>c.doc_id===docId&&c.sentence_id===sentenceId),index=cs.findIndex(c=>c.reference_claim_id===claimId);
 if(index+1<cs.length)claimId=cs[index+1].reference_claim_id;
 else{const pos=sentences.findIndex(s=>s.sentence_id===sentenceId);if(pos+1>=sentences.length){tab=4;render();return}sentenceId=sentences[pos+1].sentence_id;claimId=null}
 tab=1;render();window.scrollTo({top:0,behavior:'smooth'});
}
async function action(action,extra={}){await save();await api('/api/workspace/actions','POST',{action,version,...extra});status('Atividade iniciada. Você pode acompanhar o progresso abaixo.');await reload()}
async function guard(fn){try{await fn()}catch(e){status(e.message,true)}}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;guard(async()=>{
 if(b.dataset.tab!==undefined){await save();tab=Number(b.dataset.tab);render()}
 if(b.id==='save'){await save();render()}
 if(b.id==='confirmClaim'){collect();if(!$('coverage').checked)throw Error('Confira se faltou alguma informação factual nesta frase e marque a confirmação antes de continuar.');if(!$('reviewer').value.trim())throw Error('Preencha seu nome no início da página antes de confirmar.');const c=ensureClaim();if(!c?.validated_claim.trim())throw Error('Preencha a afirmação antes de continuar.');if(['REJECTED','AMBIGUOUS'].includes(c.claim_review_status))throw Error('Esta afirmação foi marcada com um problema. Salve a decisão ou corrija o texto antes de aprová-la.');$('claimStatus').value=c.raw_extracted_claim===null?'ADDED':c.validated_claim===c.raw_extracted_claim?'APPROVED':'CORRECTED';await save();tab=2;render();window.scrollTo({top:0,behavior:'smooth'})}
 if(b.id==='finishEvidence'){collect();const a=ann();if(!['SUPPORTED','CONTRADICTED','NOT_SUPPORTED'].includes(a.factual_label))throw Error('Escolha uma conclusão. Se ainda houver dúvida, salve para continuar depois.');if((review.draft_sets?.[claimId]||[]).length)throw Error('Há trechos selecionados que ainda não foram salvos em um grupo. Salve o grupo ou limpe a seleção antes de concluir.');if(!a.full_document_checked||!a.search_complete)throw Error('Confira a fonte e conclua a busca. Depois marque as duas confirmações abaixo da sua decisão.');if(a.factual_label==='NOT_SUPPORTED'&&(a.gold_evidence_sets||[]).length)throw Error('Você marcou evidência insuficiente, mas ainda há grupos salvos como suficientes. Confira esses grupos antes de concluir.');if(a.factual_label!=='NOT_SUPPORTED'&&!(a.gold_evidence_sets||[]).length)throw Error('Marque os trechos e clique em “Salvar trechos selecionados como um grupo” antes de concluir.');$('finalized').checked=true;await save();tab=3;render();window.scrollTo({top:0,behavior:'smooth'})}
 if(b.id==='nextItem'){await save();await advance()}
 if(b.id==='resume'){await save();const item=records().find(c=>c.doc_id===docId&&(c.claim_review_status==='PENDING'||review.claims[c.reference_claim_id]?.review_status!=='FINALIZADO'));if(item){claimId=item.reference_claim_id;sentenceId=item.sentence_id}tab=1;render()}
 if(b.dataset.sentenceReview){await save();sentenceId=b.dataset.sentenceReview;claimId=null;tab=1;render()}
 if(b.dataset.doc){await save();docId=b.dataset.doc;tab=1;render()}
 if(b.dataset.cid){await save();claimId=b.dataset.cid;sentenceId=view.catalog[claimId].sentence_id;tab=1;render()}
 if(b.id==='addClaim'){await save();const text=prompt('Escreva a afirmação que faltou, em inglês, preservando o sentido da frase original:');if(!text?.trim())return;const id=docId+':H'+crypto.randomUUID().replaceAll('-','');ext().claims[id]={reference_claim_id:id,doc_id:docId,sentence_id:sentenceId,raw_extracted_claim:null,validated_claim:text.trim(),claim_review_status:'ADDED',correction_type:'OMISSION',created_at:new Date().toISOString()};claimId=id;view.catalog[id]=ext().claims[id];render();await save();render()}
 if(b.id==='set'){collect();const ids=[...new Set(review.draft_sets?.[claimId]||[])].sort();if(!ids.length)throw Error('Marque pelo menos um trecho do documento antes de salvar o grupo');ann().gold_evidence_sets??=[];if(ann().gold_evidence_sets.some(g=>JSON.stringify([...g].sort())===JSON.stringify(ids)))throw Error('Conjunto já salvo');ann().gold_evidence_sets.push(ids);review.draft_sets[claimId]=[];await save();render()}
 if(b.id==='clearSelection'){review.draft_sets??={};review.draft_sets[claimId]=[];await save();render()}
 if(b.dataset.removeSet!==undefined){ann().gold_evidence_sets.splice(Number(b.dataset.removeSet),1);await save();render()}
 if(b.id==='generate')await action('generate',{claim_id:claimId,seed:42,analyze_types:true});
 if(b.dataset.decide){const id=b.dataset.decide,p=ext().perturbations[id];p.human_review={status:document.querySelector(`[data-proposal-status="${id}"]`).value,expected_relation:document.querySelector(`[data-proposal-label="${id}"]`).value,evidence_relation_confirmed:document.querySelector(`[data-proposal-confirm="${id}"]`).checked,notes:document.querySelector(`[data-proposal-notes="${id}"]`).value,reviewed_by:$('reviewer').value.trim(),updated_at:new Date().toISOString()};await save();render()}
 if(b.id==='freeze')await action('freeze');if(['materialize','experiment'].includes(b.id))await action(b.id,{snapshot_job:$('snapshot').value});
 if(b.id==='reload')await reload();if(b.id==='download'){await save();const url=URL.createObjectURL(new Blob([JSON.stringify(review,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='revisao_integrada.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
})});
$('document').onchange=()=>guard(async()=>{await save();docId=$('document').value;render()});$('sentence').onchange=()=>guard(async()=>{await save();sentenceId=$('sentence').value;render()});$('claim').onchange=()=>guard(async()=>{await save();claimId=$('claim').value;render()});
document.addEventListener('input',e=>{if(e.target.id==='search'){search=e.target.value;renderPassages();return}if(e.target.closest('#panel')||e.target.id==='reviewer'){dirty=true;status('Alteração local — salve antes de fechar.');if(!e.target.matches('[data-proposal-notes],#strategies,#seed'))scheduleSave()}});
document.addEventListener('change',e=>{if(e.target.dataset.evidence){const sid=e.target.dataset.evidence;review.draft_sets??={};const selected=new Set(review.draft_sets[claimId]||[]);if(e.target.checked)selected.add(sid);else selected.delete(sid);review.draft_sets[claimId]=[...selected];document.querySelectorAll('[data-evidence]').forEach(el=>{if(el.dataset.evidence===sid)el.checked=e.target.checked});dirty=true;selectionCount();scheduleSave()}if(e.target.id==='pendingOnly')document.querySelectorAll('#pendingClaims .pending-item').forEach(p=>p.hidden=e.target.checked&&p.dataset.state!=='PENDING')});
document.addEventListener('toggle',e=>{if(e.target.id==='sourceSearch'&&e.target.isConnected)sourceSearchOpen=e.target.open},true);
window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});
function scheduleSave(){clearTimeout(timer);timer=setTimeout(()=>guard(save),800)}
document.addEventListener('change',e=>{if(e.target.closest('#panel')&&!e.target.matches('[data-evidence],#search,#pendingOnly,#strategies,#seed,[data-proposal-status],[data-proposal-label],[data-proposal-confirm]'))scheduleSave()});
setInterval(()=>guard(async()=>{if(!view||saving||dirty||document.hidden)return;const next=await api('/api/workspace');const completed=(next.jobs||[]).some(j=>['COMPLETE','FAILED'].includes(j.status)&&!(view.jobs||[]).some(old=>old.id===j.id&&old.status===j.status));if(completed){await reload()}else{view.jobs=next.jobs;renderJobs()}}),2500);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!dirty&&!saving)guard(reload)});
guard(reload);
</script></html>
